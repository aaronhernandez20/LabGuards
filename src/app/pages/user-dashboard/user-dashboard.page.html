<ion-header [translucent]="true">
  <ion-toolbar color="tertiary">
    <ion-title>Panel de Operador</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="handleLogout()">Cerrar Sesión</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card color="light">
    <ion-card-header>
      <ion-card-title>Hola, {{ currentSession()?.username }}</ion-card-title>
      <ion-card-subtitle>Rol: {{ currentSession()?.role }}</ion-card-subtitle>
    </ion-card-header>
    <ion-card-content>
      <p>Has superado la validación del enrutador (<code>authGuard</code> + <code>roleGuard('user')</code>).</p>
      <p>Tu rol no tiene acceso a <code>/admin</code>: si intentas entrar, el guard te devolverá aquí.</p>
    </ion-card-content>
  </ion-card>
</ion-content>
